<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 24-Hour Lead Machine — Free Guide for Small Businesses | SaaslyHubs</title>
<meta name="description" content="Free guide: turn social traffic into email leads in 24 hours. The simple 3-step funnel small businesses use to stop losing visitors. Instant access.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#fdf6f8;
  --cream:#f8e8ee;
  --ink:#1a1a1a;
  --ink-soft:#4a3540;
  --muted:#8a7480;
  --lavender:#c9a0dc;
  --lavender-deep:#9b72cf;
  --lavender-dark:#7a52b0;
  --white:#ffffff;
  --line:rgba(155,114,207,.18);
  --shadow-sm:0 4px 14px rgba(155,114,207,.10);
  --shadow-md:0 18px 40px -12px rgba(155,114,207,.25);
  --shadow-lg:0 30px 70px -20px rgba(122,82,176,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Karla',sans-serif;
  font-size:17px;
  line-height:1.65;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:-.01em;line-height:1.1;}

/* Top announcement */
.announce{
  background:var(--ink);
  color:#fff;
  text-align:center;
  font-size:.82rem;
  padding:10px 16px;
  letter-spacing:.04em;
}
.announce strong{color:var(--lavender);}

/* Header */
.nav{
  background:rgba(253,246,248,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:18px 24px;
  text-align:center;
  position:sticky;top:0;z-index:50;
}
.logo{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:1.6rem;
  letter-spacing:.02em;
  color:var(--ink);
}
.logo span{color:var(--lavender-deep);font-style:italic;}

/* HERO */
.hero{
  max-width:1180px;
  margin:0 auto;
  padding:70px 24px 90px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:80px;
  align-items:center;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--cream);
  color:var(--lavender-dark);
  padding:8px 16px;
  border-radius:999px;
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:24px;
}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lavender-deep);}
h1{
  font-size:clamp(2.6rem,5.2vw,4.2rem);
  margin-bottom:22px;
  color:var(--ink);
}
h1 em{font-style:italic;color:var(--lavender-deep);}
.lede{
  font-size:1.18rem;
  color:var(--ink-soft);
  margin-bottom:28px;
  max-width:540px;
}

/* OPT-IN */
.optin{
  background:var(--white);
  border-radius:28px;
  padding:38px 32px;
  box-shadow:var(--shadow-lg);
  border:1px solid var(--line);
  position:relative;
  text-align:center;
}
.optin::before{
  content:"FREE";
  position:absolute;
  top:-14px;right:24px;
  background:var(--ink);
  color:var(--lavender);
  font-family:'Karla',sans-serif;
  font-size:.7rem;
  font-weight:700;
  letter-spacing:.15em;
  padding:6px 12px;
  border-radius:6px;
}

/* MOCKUP IMAGE */
.cover{
  width:170px;
  height:230px;
  margin:0 auto 22px;
  border-radius:8px;
  overflow:hidden;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.optin h3{font-size:1.7rem;margin-bottom:8px;}
.optin p.sub{font-size:.95rem;color:var(--muted);margin-bottom:22px;}

/* MAILERLITE WRAPPER (ingen designändring) */
.ml-embedded{
  margin-top:10px;
}

/* resten av din design är oförändrad */
</style>
</head>

<body>

<div class="announce">⚡ <strong>Free for a limited time</strong> — Instant download, no credit card</div>

<header class="nav">
  <div class="logo">Saasly<span>Hubs</span></div>
</header>

<section class="hero">

  <div>
    <span class="eyebrow">Free guide for small businesses</span>
    <h1>Turn your social traffic into <em>real email leads</em> — in 24 hours.</h1>
    <p class="lede">Getting clicks but no customers? <strong>You're losing 97% of your visitors</strong>.</p>
  </div>

  <aside class="optin">

    <!-- MOCKUP -->
    <div class="cover">
      <img src="TurnYourContenttoleads.png" alt="Guide mockup">
    </div>

    <h3>Get instant access</h3>
    <p class="sub">Delivered in under 2 minutes.</p>

    <!-- MAILERLITE FORM -->
    <div class="ml-embedded" data-form="NNV6qP"></div>

  </aside>

</section>

</body>
</html>
